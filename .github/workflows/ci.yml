name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**

permissions:
  contents: read

jobs:
  verify:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.12.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Astro check
        run: bun run check

      - name: Validate Discord invite wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "export const DISCORD_URL = 'https://discord.gg/RUFFbEaeDx';" src/constants/urls.ts
          grep -Fq '"sameAs": [DISCORD_URL]' src/layouts/Layout.astro
          for component in \
            src/components/layout/Navbar.tsx \
            src/components/home/HeroSection.tsx \
            src/components/home/CTASection.tsx; do
            grep -Fq 'href={DISCORD_URL}' "$component"
          done
          if grep -RFq 'https://discord.com/invite/KaburAjaDulu' src README.md AGENTS.md CLAUDE.md; then
            echo 'Stale Discord invite URL found.' >&2
            exit 1
          fi

      - name: Build production site
        run: bun run build

      - name: Smoke-test generated routes and invite
        shell: bash
        run: |
          set -euo pipefail
          pages=(
            dist/index.html
            dist/id/index.html
            dist/en/index.html
            dist/ja/index.html
            dist/zh-cn/index.html
            dist/zh-tw/index.html
            dist/ko/index.html
            dist/es/index.html
            dist/ar/index.html
            dist/nl/index.html
            dist/it/index.html
            dist/de/index.html
            dist/fr/index.html
            dist/sv/index.html
          )
          for page in "${pages[@]}"; do
            test -s "$page"
            grep -Fq 'https://discord.gg/RUFFbEaeDx' "$page"
          done
