name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check changed lines for whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            git diff --check "$BASE_SHA" HEAD
          else
            git show --format= --check HEAD
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Astro check
        run: bun run check

      - name: Validate Discord invite wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "export const DISCORD_URL = 'https://discord.gg/RUFFbEaeDx';" src/constants/urls.ts
          grep -Fq '"sameAs": [DISCORD_URL]' src/layouts/Layout.astro
          for component in \
            src/components/layout/Navbar.tsx \
            src/components/home/HeroSection.tsx \
            src/components/home/CTASection.tsx; do
            grep -Fq 'href={DISCORD_URL}' "$component"
          done
          if grep -RFq 'https://discord.com/invite/KaburAjaDulu' src README.md AGENTS.md CLAUDE.md; then
            echo 'Stale Discord invite URL found.' >&2
            exit 1
          fi

      - name: Build production site
        run: bun run build

      - name: Validate public content and interface runtime
        run: bun run validate:interface-runtime

      - name: Unit tests
        run: bun run test:unit

      - name: Worker tests
        run: bun run test:worker

      - name: Verify local D1 migrations
        run: bunx wrangler d1 migrations apply AGENDA_DB --local --env staging --config wrangler.jsonc

      - name: Smoke-test generated routes and invite
        shell: bash
        run: |
          set -euo pipefail
          pages=(
            dist/index.html
            dist/id/index.html
            dist/en/index.html
            dist/ja/index.html
            dist/zh-cn/index.html
            dist/zh-tw/index.html
            dist/ko/index.html
            dist/es/index.html
            dist/ar/index.html
            dist/nl/index.html
            dist/it/index.html
            dist/de/index.html
            dist/fr/index.html
            dist/sv/index.html
          )
          for page in "${pages[@]}"; do
            test -s "$page"
            grep -Fq 'https://discord.gg/RUFFbEaeDx' "$page"
          done

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: bun run test:e2e

      - name: Upload failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-failures-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
