name: Staging

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Verify and deploy staging
    if: >-
      vars.CLOUDFLARE_STAGING_ENABLED == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: Preview
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check interface
        run: bun run check

      - name: Build staging site
        env:
          PUBLIC_STAGING_FIXTURES: 'true'
        run: bun run build

      - name: Validate public runtime boundary
        env:
          PUBLIC_STAGING_FIXTURES: 'true'
        run: bun run validate:interface-runtime

      - name: Unit tests
        run: bun run test:unit

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run staging fixture E2E
        run: bun run test:e2e:staging

      - name: Deploy isolated staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run deploy:staging
