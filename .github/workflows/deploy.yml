name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Check out tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build production site
        run: bun run build

      - name: Deploy production site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_MAIN_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          current_main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$current_main_sha" != "$EXPECTED_MAIN_SHA" ]]; then
            echo "Refusing stale deployment: tested=$EXPECTED_MAIN_SHA current=$current_main_sha" >&2
            exit 1
          fi
          cloudflare_token="$CLOUDFLARE_API_TOKEN"
          if [[ "$cloudflare_token" == curl*api.cloudflare.com/client/v4/user/tokens/verify* ]] &&
             [[ "$cloudflare_token" =~ Authorization:[[:space:]]Bearer[[:space:]]([A-Za-z0-9._-]+) ]]; then
            cloudflare_token="${BASH_REMATCH[1]}"
          else
            cloudflare_token="${cloudflare_token//$'\r'/}"
            cloudflare_token="${cloudflare_token//$'\n'/}"
          fi
          if [[ ! "$cloudflare_token" =~ ^[A-Za-z0-9._-]{30,}$ ]]; then
            echo "Cloudflare API token secret has an unsupported format" >&2
            exit 1
          fi
          export CLOUDFLARE_API_TOKEN="$cloudflare_token"
          bun run deploy:ci
